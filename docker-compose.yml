services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: linguatube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: linguatube
    volumes:
      - learning-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U linguatube']
      interval: 5s
      retries: 10
  api:
    build: backend
    ports: ['127.0.0.1:8000:8000']
    environment:
      DATABASE_URL: postgresql+psycopg://linguatube:${POSTGRES_PASSWORD}@database:5432/linguatube
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","https://com.st4rlight3.linguatube"]}
      TRANSLATION_URL: ${TRANSLATION_URL:-}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy
volumes:
  learning-data:
